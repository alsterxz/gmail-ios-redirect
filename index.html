<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Abrir en Gmail</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #f7f8fa; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 420px); background: white; border: 1px solid #e2e5e9; border-radius: 22px; padding: 30px 24px; box-sizing: border-box; text-align: center; box-shadow: 0 12px 34px rgba(28,39,49,.09); }
    .icon { width: 68px; height: 52px; margin: 0 auto 18px; }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { margin: 0 0 22px; color: #5f6368; line-height: 1.45; }
    a { display: inline-block; background: #0b57d0; color: white; text-decoration: none; font-weight: 700; padding: 14px 22px; border-radius: 999px; }
    small { display: block; margin-top: 22px; color: #7b8087; line-height: 1.4; }
  </style>
  <script src="redirect.js?v=3" defer></script>
</head>
<body>
  <main>
    <svg class="icon" viewBox="0 0 64 48" aria-hidden="true"><path fill="#4285f4" d="M4 8v32h10V17L32 30 50 17v23h10V8L32 28z"/><path fill="#ea4335" d="M4 8l28 20L60 8v8L32 36 4 16z"/><path fill="#fbbc04" d="M4 16l10 7v17H4z"/><path fill="#34a853" d="M60 16l-10 7v17h10z"/></svg>
    <h1>Abrir correo</h1>
    <p id="status">Preparando la conversación…</p>
    <a id="open-link" href="#" hidden>Abrir en Gmail web</a>
    <small>No almacena correos, remitentes ni contenido. Gmail para iPhone ya no admite abrir una conversación mediante su esquema interno, por eso usamos la vista web oficial.</small>
  </main>
</body>
</html>
